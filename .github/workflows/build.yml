name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Fabric mod
        run: bash gradlew build
      - name: Build Paper integration
        run: bash gradlew -p paper-integration build
      - uses: actions/upload-artifact@v4
        with:
          name: hb3d-build
          path: |
            build/libs/*.jar
            paper-integration/build/libs/*.jar
